name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Code Quality, Test Suite & Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies from frozen lockfile
        run: uv sync --frozen

      - name: Check code formatting (Ruff format)
        run: uv run ruff format --check .

      - name: Lint source code (Ruff check)
        run: uv run ruff check .

      - name: Run automated test suite (Pytest)
        run: uv run pytest

      - name: Validate Docker Compose specification syntax
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose config
