# ==============================================================================
# Configuration des hooks pre-commit — fhir-pipeline (Togo)
# Validation locale : uv run pre-commit run --all-files
# Validation syntaxique : uv run pre-commit validate-config .pre-commit-config.yaml
# ==============================================================================

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix]
      - id: ruff-format
        name: ruff-format
