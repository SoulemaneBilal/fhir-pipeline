[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir-pipeline"
version = "0.1.0"
description = "Pipeline de standardisation et d'interopérabilité de données de santé (Togo) : sources fragmentées vers FHIR R4, OpenHIE, OMOP CDM 5.4 et Parquet pour l'IA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Équipe fhir-pipeline" }
]
keywords = ["fhir", "omop", "openhie", "togo", "health-data", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pandera>=0.20.0",
    "splink>=4.0.0",
    "rapidfuzz>=3.6.0",
    "fhir.resources==7.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
fhir-pipeline = "src.cli:app"
pipeline = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "T20",  # flake8-print (interdiction formelle des print en production)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501", # Largeur de ligne gérée par le formatter
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "ARG"]  # print et arguments inutilisés tolérés dans la suite de tests

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
